<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto">
  <defs>
    <!-- Background Card Gradient: Cream Silk -->
    <linearGradient id="card-light-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#F3E9DA" />
    </linearGradient>

    <!-- Celestial Planet 1: Jovian/Terrestrial Radial Gradient -->
    <radialGradient id="planet-outer-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="45%" stop-color="#D6BDA4" />
      <stop offset="85%" stop-color="#8E3E4B" />
      <stop offset="100%" stop-color="#541E26" />
    </radialGradient>

    <!-- Celestial Planet 2: Lunar Marble Radial Gradient -->
    <radialGradient id="planet-inner-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FAF6EE" />
      <stop offset="50%" stop-color="#C7B49D" />
      <stop offset="100%" stop-color="#722F37" />
    </radialGradient>

    <!-- Planetary Ring Linear Gradient -->
    <linearGradient id="planet-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7B49D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FAF6EE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#886D5B" stop-opacity="0.8" />
    </linearGradient>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap');
      svg { pointer-events: none; user-select: none; }

      .mono { font-family: 'Space Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
      .grotesk { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .cat-tag { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #722F37; }
      .card-title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; fill: #1C0F14; }
      .card-subtitle { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15.5px; font-weight: 800; fill: #722F37; }
      .card-body { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 600; fill: #241117; line-height: 1.5; }

      /* ==================== ANIMATIONS FOR ALL BESPOKE SHAPES ==================== */

      /* SHAPE 001: BENTO WIREFRAME GRID ANIMATION */
      .bento-grid-float {
        animation: floatBento 4s ease-in-out infinite alternate;
      }
      @keyframes floatBento {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
      .active-card-pulse {
        animation: activePulse 2.8s ease-in-out infinite alternate;
      }
      @keyframes activePulse {
        0% { filter: drop-shadow(0 2px 5px rgba(114, 47, 55, 0.08)); }
        100% { filter: drop-shadow(0 6px 16px rgba(114, 47, 55, 0.24)); }
      }
      .lead-dot-pulse {
        animation: leadDotPulse 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        transform-origin: -48px 18px;
      }
      @keyframes leadDotPulse {
        0% { transform: scale(0.7); opacity: 0.9; }
        100% { transform: scale(1.8); opacity: 0; }
      }
      .conduit-flow {
        stroke-dasharray: 4 3;
        animation: conduitDash 1.8s linear infinite;
      }
      @keyframes conduitDash {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -14; }
      }

      /* SHAPE 002: Modular Layers Staggered Levitation */
      .layer-float-1 { animation: floatL1 3.5s ease-in-out infinite alternate; }
      .layer-float-2 { animation: floatL2 3.5s ease-in-out infinite alternate 0.5s; }
      .layer-float-3 { animation: floatL3 3.5s ease-in-out infinite alternate 1s; }
      @keyframes floatL1 { 0% { transform: translateY(0px); } 100% { transform: translateY(-7px); } }
      @keyframes floatL2 { 0% { transform: translateY(0px); } 100% { transform: translateY(-4px); } }
      @keyframes floatL3 { 0% { transform: translateY(0px); } 100% { transform: translateY(-2px); } }

      /* SHAPE 003: 3D SPATIAL KINETIC CUBE */
      .outer-cage-float {
        animation: floatCage 4.2s ease-in-out infinite alternate;
      }
      @keyframes floatCage {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
      .inner-cube-levitate {
        animation: levitateCube 3.2s ease-in-out infinite alternate;
      }
      @keyframes levitateCube {
        0% { transform: translateY(6px); }
        100% { transform: translateY(-8px); }
      }
      .inner-cube-glow {
        animation: cubeGlow 2.8s ease-in-out infinite alternate;
      }
      @keyframes cubeGlow {
        0% { filter: drop-shadow(0 2px 4px rgba(114, 47, 55, 0.15)); }
        100% { filter: drop-shadow(0 4px 12px rgba(114, 47, 55, 0.35)); }
      }

      /* SHAPE 004: Ascending Rocket & Textured Celestial Orbits */
      .rocket-hover {
        animation: rocketLevitate 2.8s ease-in-out infinite alternate;
      }
      .thrust-pulse {
        animation: thrustFlicker 0.4s ease-in-out infinite alternate;
      }
      .orbit-outer {
        animation: spinCW 24s linear infinite;
        transform-origin: 0px 0px;
      }
      .orbit-inner {
        animation: spinCCW 15s linear infinite;
        transform-origin: 0px 0px;
      }
      @keyframes rocketLevitate {
        0% { transform: translateY(3px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes thrustFlicker {
        0% { transform: scaleY(0.7); opacity: 0.7; }
        100% { transform: scaleY(1.3); opacity: 1; }
      }
      @keyframes spinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    ]]></style>
  </defs>

  <!-- ==================== CARD 001: RESEARCH & LOGIC ==================== -->
  <g transform="translate(0, 0)">
    <rect width="285" height="520" rx="14" fill="url(#card-light-grad)" stroke="#D6C4AE" stroke-width="1.4" />
    <text x="24" y="38" class="cat-tag">001 // RESEARCH</text>
    <line x1="24" y1="48" x2="260" y2="48" stroke="#E4D7C5" stroke-width="1" />
    
    <!-- Bespoke Graphic 001: Big, Clean Wireframe Bento Architecture -->
    <g transform="translate(136, 130)">
      <!-- Ambient Ground Shadow -->
      <ellipse cx="6" cy="48" rx="52" ry="10" fill="rgba(114, 47, 55, 0.05)" />

      <!-- Floating Bento Architecture Group -->
      <g class="bento-grid-float">
        <!-- Top Row -->
        <!-- Card 1 (Top-Left) -->
        <rect x="-24" y="-38" width="44" height="26" rx="5" fill="rgba(214, 196, 174, 0.28)" stroke="#D6C4AE" stroke-width="1.6" />
        <!-- Card 2 (Top-Right) -->
        <rect x="27" y="-38" width="54" height="26" rx="5" fill="rgba(214, 196, 174, 0.28)" stroke="#D6C4AE" stroke-width="1.6" />

        <!-- Bottom Row -->
        <!-- Card 4 (Bottom-Right Upper) -->
        <rect x="27" y="-5" width="54" height="20" rx="5" fill="rgba(214, 196, 174, 0.28)" stroke="#D6C4AE" stroke-width="1.6" />
        <!-- Card 5 (Bottom-Right Lower) -->
        <rect x="27" y="22" width="54" height="20" rx="5" fill="rgba(214, 196, 174, 0.28)" stroke="#D6C4AE" stroke-width="1.6" />

        <!-- Card 3 (Bottom-Left: Prominent Active Focus Card - Clean & Bold) -->
        <g class="active-card-pulse">
          <rect x="-24" y="-5" width="44" height="47" rx="6" fill="#FAF7F2" stroke="#722F37" stroke-width="2.4" />
        </g>

        <!-- User Research Lead-in Node & Dashed Conduit -->
        <circle cx="-48" cy="18" r="8" fill="none" stroke="#722F37" stroke-width="1" class="lead-dot-pulse" />
        <line x1="-42" y1="18" x2="-24" y2="18" stroke="#722F37" stroke-width="2.2" class="conduit-flow" />
        <circle cx="-48" cy="18" r="4.5" fill="#722F37" />
        <circle cx="-48" cy="18" r="1.8" fill="#FAF6EE" />
      </g>
    </g>

    <!-- Content: Pranov's Research & UX Focus -->
    <g transform="translate(24, 258)">
      <text x="0" y="0" class="card-title">Research &amp; UX</text>
      <text x="0" y="28" class="card-subtitle">Deconstruct complex flows.</text>
      <text x="0" y="68" class="card-body">
        <tspan x="0" dy="0">User research, journey maps,</tspan>
        <tspan x="0" dy="24">and intuitive wireframing.</tspan>
        <tspan x="0" dy="24">Turning ambiguous problems</tspan>
        <tspan x="0" dy="24">into clear user experiences.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CARD 002: DESIGN SYSTEMS ==================== -->
  <g transform="translate(305, 0)">
    <rect width="285" height="520" rx="14" fill="url(#card-light-grad)" stroke="#D6C4AE" stroke-width="1.4" />
    <text x="24" y="38" class="cat-tag">002 // SYSTEMS</text>
    <line x1="24" y1="48" x2="260" y2="48" stroke="#E4D7C5" stroke-width="1" />
    
    <!-- Bespoke Graphic 002: Staggered Component Tokens & Calipers -->
    <g transform="translate(142, 130)">
      <!-- Bottom Layer (Architecture) -->
      <g class="layer-float-3">
        <polygon points="0,-18 48,6 0,30 -48,6" fill="rgba(214, 196, 174, 0.35)" stroke="#C7B49D" stroke-width="1.3" />
      </g>
      <!-- Middle Layer (Components) -->
      <g class="layer-float-2">
        <polygon points="0,-32 48,-8 0,16 -48,-8" fill="rgba(114, 47, 55, 0.12)" stroke="#886D5B" stroke-width="1.4" />
        <line x1="0" y1="-32" x2="0" y2="16" stroke="#D6C4AE" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="-24" y1="-20" x2="24" y2="4" stroke="#D6C4AE" stroke-width="1" stroke-dasharray="3 3" />
      </g>
      <!-- Top Layer (Design Tokens) -->
      <g class="layer-float-1">
        <polygon points="0,-46 48,-22 0,2 -48,-22" fill="#FAF7F2" stroke="#722F37" stroke-width="1.8" />
        <circle cx="0" cy="-22" r="5" fill="#722F37" />
        <circle cx="-20" cy="-22" r="3" fill="#886D5B" />
        <circle cx="20" cy="-22" r="3" fill="#886D5B" />
        <!-- Caliper tick marks with clean spacing & no overlapping -->
        <line x1="-58" y1="-38" x2="-58" y2="-6" stroke="#722F37" stroke-width="1.2" />
        <line x1="-61" y1="-38" x2="-55" y2="-38" stroke="#722F37" stroke-width="1" />
        <line x1="-61" y1="-6" x2="-55" y2="-6" stroke="#722F37" stroke-width="1" />
        <line x1="-55" y1="-38" x2="-48" y2="-30" stroke="#D6C4AE" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="-55" y1="-6" x2="-48" y2="-14" stroke="#D6C4AE" stroke-width="0.8" stroke-dasharray="2 2" />
        <!-- Dimension Tag: 8px (Pure Typography, No Border) -->
        <text x="-65" y="-19" fill="#722F37" class="mono" font-size="9" font-weight="700" text-anchor="end">8px</text>
      </g>
    </g>

    <!-- Content: Pranov's Design Systems Focus -->
    <g transform="translate(24, 258)">
      <text x="0" y="0" class="card-title">Design Systems</text>
      <text x="0" y="28" class="card-subtitle">Tokens, scales &amp; precision.</text>
      <text x="0" y="68" class="card-body">
        <tspan x="0" dy="0">Scalable component tokens</tspan>
        <tspan x="0" dy="24">in Figma and Tailwind CSS.</tspan>
        <tspan x="0" dy="24">Enforcing visual hierarchy,</tspan>
        <tspan x="0" dy="24">accessibility &amp; consistency.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CARD 003: MOTION & PHYSICS ==================== -->
  <g transform="translate(610, 0)">
    <rect width="285" height="520" rx="14" fill="url(#card-light-grad)" stroke="#D6C4AE" stroke-width="1.4" />
    <text x="24" y="38" class="cat-tag">003 // MOTION</text>
    <line x1="24" y1="48" x2="260" y2="48" stroke="#E4D7C5" stroke-width="1" />
    
    <!-- Bespoke Graphic 003: 3D Spatial Bounding Cage & Levitation Core -->
    <g transform="translate(142, 130)">
      <!-- Ambient Floor Shadow -->
      <ellipse cx="0" cy="46" rx="42" ry="12" fill="rgba(114, 47, 55, 0.06)" />

      <!-- Outer 3D Spatial Wireframe Cage -->
      <g class="outer-cage-float">
        <!-- Outer Hexagon Silhouette -->
        <polygon points="0,-48 42,-24 42,24 0,48 -42,24 -42,-24" fill="rgba(214, 196, 174, 0.12)" stroke="#C7B49D" stroke-width="1.5" stroke-linejoin="round" />
        <!-- Internal Spatial Corner Edges meeting at Center (0, 0) -->
        <line x1="0" y1="0" x2="0" y2="-48" stroke="#C7B49D" stroke-width="1.3" opacity="0.75" />
        <line x1="0" y1="0" x2="-42" y2="24" stroke="#C7B49D" stroke-width="1.3" opacity="0.75" />
        <line x1="0" y1="0" x2="42" y2="24" stroke="#C7B49D" stroke-width="1.3" opacity="0.75" />

        <!-- Interior Levitation Floor Shadow beneath Inner Cube -->
        <ellipse cx="0" cy="22" rx="20" ry="8" fill="rgba(114, 47, 55, 0.12)" />

        <!-- Inner 3D Kinetic Core (Floating / Oscillating with Spring Physics) -->
        <g class="inner-cube-levitate">
          <g class="inner-cube-glow">
            <!-- Left Face -->
            <polygon points="-21,-12 0,0 0,24 -21,12" fill="rgba(114, 47, 55, 0.14)" stroke="#722F37" stroke-width="2.4" stroke-linejoin="round" />
            <!-- Right Face -->
            <polygon points="0,0 21,-12 21,12 0,24" fill="rgba(114, 47, 55, 0.25)" stroke="#722F37" stroke-width="2.4" stroke-linejoin="round" />
            <!-- Top Face -->
            <polygon points="0,-24 21,-12 0,0 -21,-12" fill="#FAF7F2" stroke="#722F37" stroke-width="2.4" stroke-linejoin="round" />
          </g>
        </g>
      </g>
    </g>

    <!-- Content: Pranov's Motion Focus -->
    <g transform="translate(24, 258)">
      <text x="0" y="0" class="card-title">Kinetic Physics</text>
      <text x="0" y="28" class="card-subtitle">Spring physics &amp; fluid easing.</text>
      <text x="0" y="68" class="card-body">
        <tspan x="0" dy="0">High-framerate micro-interactions,</tspan>
        <tspan x="0" dy="24">natural spring-damping curves,</tspan>
        <tspan x="0" dy="24">and reactive spatial canvases that</tspan>
        <tspan x="0" dy="24">delight on every interaction.</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== CARD 004: PROTOTYPE TO SHIP ==================== -->
  <g transform="translate(915, 0)">
    <rect width="285" height="520" rx="14" fill="url(#card-light-grad)" stroke="#D6C4AE" stroke-width="1.4" />
    <text x="24" y="38" class="cat-tag">004 // SHIP</text>
    <line x1="24" y1="48" x2="260" y2="48" stroke="#E4D7C5" stroke-width="1" />
    
    <!-- Bespoke Graphic 004: Deployment Rocket & Textured Celestial Orbits -->
    <g transform="translate(142, 130)">
      <!-- Outer Orbit Track & Textured Saturn-like Planet (Revolving CW in background) -->
      <g class="orbit-outer">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="48" fill="none" stroke="#D6C4AE" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.65" />
        <!-- Planet 1 with Ring & Atmospheric Bands -->
        <g opacity="0.9">
          <!-- Back half of planetary ring -->
          <ellipse cx="48" cy="0" rx="11" ry="3.2" fill="none" stroke="url(#planet-ring-grad)" stroke-width="1.2" transform="rotate(-25 48 0)" opacity="0.75" />
          <!-- Planet Sphere -->
          <circle cx="48" cy="0" r="6.8" fill="url(#planet-outer-grad)" />
          <!-- Surface atmospheric bands -->
          <path d="M 42.5 -1.2 Q 48 1 53.5 -1.2" fill="none" stroke="#FAF6EE" stroke-width="0.8" opacity="0.55" />
          <path d="M 43 1.5 Q 48 3.8 53 1.5" fill="none" stroke="#541E26" stroke-width="0.7" opacity="0.35" />
          <!-- Polar highlight -->
          <circle cx="46.5" cy="-3.5" r="1.1" fill="#FAF6EE" opacity="0.8" />
        </g>
      </g>

      <!-- Inner Orbit Track & Textured Terrestrial Planet (Revolving CCW in background) -->
      <g class="orbit-inner">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="15s" repeatCount="indefinite" />
        <circle cx="0" cy="0" r="32" fill="none" stroke="rgba(114, 47, 55, 0.22)" stroke-width="1.1" stroke-dasharray="3 3" />
        <!-- Planet 2 with Crater Textures -->
        <g opacity="0.85">
          <circle cx="-32" cy="0" r="4.6" fill="url(#planet-inner-grad)" />
          <!-- Subtle craters -->
          <circle cx="-33.5" cy="-1.2" r="1" fill="#541E26" opacity="0.45" />
          <circle cx="-30.5" cy="1.2" r="0.75" fill="#541E26" opacity="0.35" />
          <!-- Crescent specular highlight -->
          <circle cx="-33.5" cy="-2" r="0.8" fill="#FAF6EE" opacity="0.7" />
        </g>
      </g>

      <!-- Ascending Rocket Vector (Layered on top of orbits) -->
      <g class="rocket-hover">
        <!-- Thruster Flame -->
        <polygon points="0,24 -4,11 4,11" fill="#FF441F" class="thrust-pulse" />
        <polygon points="0,18 -2,11 2,11" fill="#FFAE1A" />

        <!-- Rocket Body -->
        <path d="M 0 -26 C 6 -16 8 -4 8 10 L -8 10 C -8 -4 -6 -16 0 -26 Z" fill="#FAF6EE" stroke="#722F37" stroke-width="1.8" />
        <!-- Wings / Fins -->
        <path d="M -8 2 L -14 11 L -8 10 Z" fill="#722F37" />
        <path d="M 8 2 L 14 11 L 8 10 Z" fill="#722F37" />
        <!-- Porthole Window -->
        <circle cx="0" cy="-6" r="3" fill="#722F37" />
        <circle cx="0" cy="-6" r="1.2" fill="#FAF6EE" />
      </g>
    </g>

    <!-- Content: Pranov's Engineering & Ship -->
    <g transform="translate(24, 258)">
      <text x="0" y="0" class="card-title">Code &amp; Deploy</text>
      <text x="0" y="28" class="card-subtitle">Tested, typed &amp; deployed.</text>
      <text x="0" y="68" class="card-body">
        <tspan x="0" dy="0">Type-safe architecture,</tspan>
        <tspan x="0" dy="24">containerized infrastructure,</tspan>
        <tspan x="0" dy="24">and automated CI/CD pipelines</tspan>
        <tspan x="0" dy="24">that run seamlessly at scale.</tspan>
      </text>
    </g>
  </g>
</svg>