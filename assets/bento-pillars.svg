<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="100%" height="auto">
  <defs>
    <linearGradient id="bento-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F14" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <linearGradient id="bento-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#0E1016" />
    </linearGradient>

    <style><![CDATA[
      svg { pointer-events: none; user-select: none; }
      .sans { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', 'Lato', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace; }

      .flow-node-1 { animation: nodeLit1 6s ease-in-out infinite; }
      .flow-node-2 { animation: nodeLit2 6s ease-in-out infinite; }
      .flow-node-3 { animation: nodeLit3 6s ease-in-out infinite; }
      @keyframes nodeLit1 {
        0%, 28%   { stroke: #FF4422; fill: #1A1416; }
        35%, 100% { stroke: #292E3B; fill: #12151C; }
      }
      @keyframes nodeLit2 {
        0%, 30%   { stroke: #292E3B; fill: #12151C; }
        36%, 64%  { stroke: #FF4422; fill: #1A1416; }
        70%, 100% { stroke: #292E3B; fill: #12151C; }
      }
      @keyframes nodeLit3 {
        0%, 66%   { stroke: #292E3B; fill: #12151C; }
        72%, 96%  { stroke: #FF4422; fill: #1A1416; }
        100%      { stroke: #292E3B; fill: #12151C; }
      }
      .flow-dash {
        stroke-dasharray: 5 5;
        animation: dashFlow 2.4s linear infinite;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -20; }
      }

      .token-float {
        animation: floatSlow 3.8s ease-in-out infinite alternate;
      }
      @keyframes floatSlow {
        0%   { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
      .swatch-pulse {
        animation: swatchBeat 4.5s ease-in-out infinite;
      }
      @keyframes swatchBeat {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }

      .prism-levitate {
        animation: prismFloat 3.4s ease-in-out infinite alternate;
      }
      @keyframes prismFloat {
        0%   { transform: translateY(4px); }
        100% { transform: translateY(-7px); }
      }
      .spring-dot-wave {
        animation: springDotMove 5.2s ease-in-out infinite;
      }
      @keyframes springDotMove {
        0%   { transform: translate(0px, 46px); }
        18%  { transform: translate(26px, -48px); }
        38%  { transform: translate(58px, 26px); }
        58%  { transform: translate(90px, -16px); }
        78%  { transform: translate(122px, 0px); }
        100% { transform: translate(144px, 0px); }
      }

      .deploy-orbit {
        animation: orbitSpin 18s linear infinite;
        transform-origin: 97px 90px;
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .deploy-orbit-rev {
        animation: orbitSpinRev 12s linear infinite;
        transform-origin: 97px 90px;
      }
      @keyframes orbitSpinRev {
        from { transform: rotate(360deg); }
        to   { transform: rotate(0deg); }
      }
      .prod-beacon {
        animation: prodPulse 2.2s ease-in-out infinite;
      }
      @keyframes prodPulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="556" rx="18" fill="url(#bento-shell)" stroke="#222631" stroke-width="1.5" />

  <!-- 001: RESEARCH & UX (TOP-LEFT 486px) -->
  <g transform="translate(18, 18)">
    <rect width="486" height="252" rx="14" fill="url(#bento-card)" stroke="#242834" stroke-width="1.2" />

    <g transform="translate(26, 30)">
      <text x="0" y="10" fill="#FF4422" class="mono" font-size="11" font-weight="700" letter-spacing="1.6">001 // RESEARCH</text>
      <text x="0" y="52" fill="#FAF8F4" class="sans" font-size="26" font-weight="900" letter-spacing="-0.6">Research &amp; UX</text>
      <text x="0" y="78" fill="#C7CCD6" class="sans" font-size="13.5" font-weight="700">Deconstruct complex flows.</text>

      <text x="0" y="114" fill="#8E95A2" class="sans" font-size="13" font-weight="500">
        <tspan x="0" dy="0">User research, journey maps,</tspan>
        <tspan x="0" dy="21">and wireframes turning ambiguity</tspan>
        <tspan x="0" dy="21">into intuitive architecture.</tspan>
      </text>

      <text x="0" y="198" fill="#5D6472" class="mono" font-size="10" font-weight="700" letter-spacing="1">FLOW // DISCOVERY TO PROTOTYPE</text>
    </g>

    <!-- Wireframe Flow Viewport (Cleanly Routed Outside Nodes) -->
    <g transform="translate(268, 26)">
      <rect width="194" height="200" rx="10" fill="#0A0B0E" stroke="#1E222D" stroke-width="1" />

      <path d="M 76 58 L 76 70 L 118 70 L 118 82" fill="none" stroke="#FF4422" stroke-width="1.4" class="flow-dash" opacity="0.85" />
      <path d="M 118 118 L 118 130 L 79 130 L 79 142" fill="none" stroke="#FF4422" stroke-width="1.4" class="flow-dash" opacity="0.85" />

      <!-- Node 1 -->
      <g transform="translate(20, 22)">
        <rect width="112" height="36" rx="6" class="flow-node-1" stroke-width="1.4" />
        <circle cx="14" cy="18" r="4" fill="#FF4422" />
        <rect x="26" y="12" width="54" height="4" rx="2" fill="#E6E1D6" />
        <rect x="26" y="21" width="36" height="3.5" rx="1.7" fill="#5D6472" />
      </g>

      <!-- Node 2 -->
      <g transform="translate(62, 82)">
        <rect width="112" height="36" rx="6" class="flow-node-2" stroke-width="1.4" />
        <rect x="10" y="9" width="18" height="18" rx="3" fill="none" stroke="#8E95A2" stroke-width="1.2" />
        <rect x="36" y="12" width="56" height="4" rx="2" fill="#E6E1D6" />
        <rect x="36" y="21" width="40" height="3.5" rx="1.7" fill="#5D6472" />
      </g>

      <!-- Node 3 -->
      <g transform="translate(20, 142)">
        <rect width="118" height="36" rx="6" class="flow-node-3" stroke-width="1.4" />
        <rect x="10" y="10" width="16" height="16" rx="4" fill="#FF4422" opacity="0.22" stroke="#FF4422" stroke-width="1.2" />
        <path d="M 14 18 L 17 21 L 22 15" fill="none" stroke="#FF4422" stroke-width="1.5" stroke-linecap="round" />
        <rect x="34" y="12" width="64" height="4" rx="2" fill="#FAF8F4" />
        <rect x="34" y="21" width="42" height="3.5" rx="1.7" fill="#8E95A2" />
      </g>
    </g>
  </g>

  <!-- 002: DESIGN SYSTEMS (TOP-RIGHT 660px) -->
  <g transform="translate(522, 18)">
    <rect width="660" height="252" rx="14" fill="url(#bento-card)" stroke="#242834" stroke-width="1.2" />

    <g transform="translate(28, 30)">
      <text x="0" y="10" fill="#FF4422" class="mono" font-size="11" font-weight="700" letter-spacing="1.6">002 // SYSTEMS</text>
      <text x="0" y="52" fill="#FAF8F4" class="sans" font-size="26" font-weight="900" letter-spacing="-0.6">Design Systems</text>
      <text x="0" y="78" fill="#C7CCD6" class="sans" font-size="13.5" font-weight="700">Tokens, scales &amp; precision.</text>

      <text x="0" y="114" fill="#8E95A2" class="sans" font-size="13" font-weight="500">
        <tspan x="0" dy="0">Scalable component tokens connecting</tspan>
        <tspan x="0" dy="21">Figma directly to Tailwind CSS —</tspan>
        <tspan x="0" dy="21">enforcing contrast &amp; spatial rhythm.</tspan>
      </text>

      <text x="0" y="198" fill="#5D6472" class="mono" font-size="10" font-weight="700" letter-spacing="1">SPEC // 8PX GRID · WCAG AA+</text>
    </g>

    <g transform="translate(306, 26)">
      <rect width="328" height="200" rx="10" fill="#0A0B0E" stroke="#1E222D" stroke-width="1" />

      <text x="16" y="22" fill="#6F7685" class="mono" font-size="9" font-weight="700" letter-spacing="1">COLOR TOKENS</text>
      <g transform="translate(16, 30)">
        <rect x="0" y="0" width="66" height="32" rx="5" fill="#171A22" stroke="#2D3342" stroke-width="1" />
        <text x="33" y="20" text-anchor="middle" fill="#8E95A2" class="mono" font-size="8.5" font-weight="700">#0A0B0E</text>

        <rect x="76" y="0" width="66" height="32" rx="5" fill="#F2EFE9" />
        <text x="109" y="20" text-anchor="middle" fill="#111318" class="mono" font-size="8.5" font-weight="700">#F2EFE9</text>

        <rect x="152" y="0" width="66" height="32" rx="5" fill="#FF4422" class="swatch-pulse" />
        <text x="185" y="20" text-anchor="middle" fill="#FAF8F4" class="mono" font-size="8.5" font-weight="700">#FF4422</text>

        <rect x="228" y="0" width="66" height="32" rx="5" fill="#2A2F3D" />
        <text x="261" y="20" text-anchor="middle" fill="#C7CCD6" class="mono" font-size="8.5" font-weight="700">#2A2F3D</text>
      </g>

      <line x1="16" y1="78" x2="312" y2="78" stroke="#1B1F29" stroke-width="1" />

      <g transform="translate(16, 92)">
        <text x="0" y="10" fill="#6F7685" class="mono" font-size="8.5" font-weight="700">TYPE SCALE</text>
        <text x="0" y="54" fill="#FAF8F4" class="sans" font-size="40" font-weight="900" letter-spacing="-1.5">Aa</text>
        <text x="58" y="34" fill="#C7CCD6" class="mono" font-size="9.5" font-weight="700">68 / -2.5</text>
        <text x="58" y="50" fill="#6F7685" class="mono" font-size="9" font-weight="700">1.25 RATIO</text>
      </g>

      <line x1="154" y1="90" x2="154" y2="184" stroke="#1B1F29" stroke-width="1" />

      <g transform="translate(170, 92)">
        <text x="0" y="10" fill="#6F7685" class="mono" font-size="8.5" font-weight="700">SPACING // 8PX</text>
        <g transform="translate(8, 34)" class="token-float">
          <rect x="4" y="12" width="122" height="36" rx="8" fill="#181C26" stroke="#293040" stroke-width="1" />
          <rect x="0" y="4" width="122" height="36" rx="8" fill="#FAF8F4" />
          <circle cx="18" cy="22" r="4.5" fill="#FF4422" />
          <text x="30" y="26" fill="#111318" class="sans" font-size="11.5" font-weight="800">Primary CTA</text>

          <line x1="-10" y1="4" x2="-10" y2="40" stroke="#FF4422" stroke-width="1" />
          <line x1="-13" y1="4" x2="-7" y2="4" stroke="#FF4422" stroke-width="1" />
          <line x1="-13" y1="40" x2="-7" y2="40" stroke="#FF4422" stroke-width="1" />
          <text x="61" y="64" text-anchor="middle" fill="#FF5738" class="mono" font-size="8.5" font-weight="700">pad: 16 · r: 8px</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 003: KINETIC PHYSICS (BOTTOM-LEFT 660px) -->
  <g transform="translate(18, 286)">
    <rect width="660" height="252" rx="14" fill="url(#bento-card)" stroke="#242834" stroke-width="1.2" />

    <g transform="translate(26, 30)">
      <text x="0" y="10" fill="#FF4422" class="mono" font-size="11" font-weight="700" letter-spacing="1.6">003 // MOTION</text>
      <text x="0" y="52" fill="#FAF8F4" class="sans" font-size="26" font-weight="900" letter-spacing="-0.6">Kinetic Physics</text>
      <text x="0" y="78" fill="#C7CCD6" class="sans" font-size="13.5" font-weight="700">Spring physics &amp; fluid easing.</text>

      <text x="0" y="114" fill="#8E95A2" class="sans" font-size="13" font-weight="500">
        <tspan x="0" dy="0">60fps micro-interactions, damped</tspan>
        <tspan x="0" dy="21">harmonic spring curves, and reactive</tspan>
        <tspan x="0" dy="21">spatial canvases built for tactility.</tspan>
      </text>

      <text x="0" y="198" fill="#5D6472" class="mono" font-size="10" font-weight="700" letter-spacing="1">DAMPING // ZETA 0.72 · STIFFNESS 260</text>
    </g>

    <g transform="translate(306, 26)">
      <rect width="328" height="200" rx="10" fill="#0A0B0E" stroke="#1E222D" stroke-width="1" />

      <g transform="translate(18, 24)">
        <text x="0" y="0" fill="#6F7685" class="mono" font-size="8.5" font-weight="700">SPRING RESPONSE</text>
        <line x1="0" y1="78" x2="144" y2="78" stroke="#252A36" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="22" x2="0" y2="132" stroke="#252A36" stroke-width="1" />
        <path d="M 0 124 C 14 124, 16 26, 26 28 C 38 30, 46 106, 58 104 C 70 102, 78 60, 90 62 C 102 64, 110 80, 122 78 L 144 78"
              fill="none" stroke="#FF4422" stroke-width="2.2" stroke-linecap="round" />
        <g class="spring-dot-wave">
          <circle cx="0" cy="78" r="6" fill="#FF4422" opacity="0.28" />
          <circle cx="0" cy="78" r="3.5" fill="#FAF8F4" stroke="#FF4422" stroke-width="1.5" />
        </g>
        <text x="0" y="154" fill="#8E95A2" class="mono" font-size="9">0ms</text>
        <text x="144" y="154" text-anchor="end" fill="#FF5738" class="mono" font-size="9">SETTLE 320ms</text>
      </g>

      <line x1="184" y1="20" x2="184" y2="180" stroke="#1B1F29" stroke-width="1" />

      <g transform="translate(256, 104)">
        <ellipse cx="0" cy="52" rx="40" ry="11" fill="rgba(255, 68, 34, 0.08)" />
        <polygon points="0,-54 46,-27 46,27 0,54 -46,27 -46,-27" fill="rgba(255,255,255,0.02)" stroke="#33394A" stroke-width="1.4" stroke-linejoin="round" />
        <line x1="0" y1="0" x2="0" y2="-54" stroke="#2D3342" stroke-width="1.2" />
        <line x1="0" y1="0" x2="-46" y2="27" stroke="#2D3342" stroke-width="1.2" />
        <line x1="0" y1="0" x2="46" y2="27" stroke="#2D3342" stroke-width="1.2" />

        <g class="prism-levitate">
          <polygon points="-22,-12 0,0 0,25 -22,13" fill="#2A1514" stroke="#FF4422" stroke-width="1.8" stroke-linejoin="round" />
          <polygon points="0,0 22,-12 22,13 0,25" fill="#4A1D16" stroke="#FF4422" stroke-width="1.8" stroke-linejoin="round" />
          <polygon points="0,-25 22,-12 0,0 -22,-12" fill="#FF5738" stroke="#FAF8F4" stroke-width="1.4" stroke-linejoin="round" />
        </g>
      </g>
    </g>
  </g>

  <!-- 004: CODE & DEPLOY (BOTTOM-RIGHT 486px) -->
  <g transform="translate(696, 286)">
    <rect width="486" height="252" rx="14" fill="url(#bento-card)" stroke="#242834" stroke-width="1.2" />

    <g transform="translate(26, 30)">
      <text x="0" y="10" fill="#FF4422" class="mono" font-size="11" font-weight="700" letter-spacing="1.6">004 // SHIP</text>
      <text x="0" y="52" fill="#FAF8F4" class="sans" font-size="26" font-weight="900" letter-spacing="-0.6">Code &amp; Deploy</text>
      <text x="0" y="78" fill="#C7CCD6" class="sans" font-size="13.5" font-weight="700">Tested, typed &amp; deployed.</text>

      <text x="0" y="114" fill="#8E95A2" class="sans" font-size="13" font-weight="500">
        <tspan x="0" dy="0">Type-safe architecture, containerized</tspan>
        <tspan x="0" dy="21">services, and automated CI/CD</tspan>
        <tspan x="0" dy="21">pipelines running reliably at scale.</tspan>
      </text>

      <text x="0" y="198" fill="#5D6472" class="mono" font-size="10" font-weight="700" letter-spacing="1">PIPELINE // BUILD · TEST · EDGE</text>
    </g>

    <g transform="translate(268, 26)">
      <rect width="194" height="200" rx="10" fill="#0A0B0E" stroke="#1E222D" stroke-width="1" />

      <circle cx="97" cy="90" r="62" fill="none" stroke="#1E222D" stroke-width="1.2" />
      <g class="deploy-orbit">
        <circle cx="97" cy="90" r="62" fill="none" stroke="#3B4254" stroke-width="1.2" stroke-dasharray="4 6" />
        <circle cx="159" cy="90" r="4" fill="#FF4422" />
      </g>
      <g class="deploy-orbit-rev">
        <circle cx="97" cy="90" r="40" fill="none" stroke="#FF4422" stroke-width="1" stroke-dasharray="18 32" opacity="0.55" />
        <circle cx="57" cy="90" r="3" fill="#FAF8F4" />
      </g>

      <polygon points="97,64 119,77 119,103 97,116 75,103 75,77" fill="#14171F" stroke="#FF4422" stroke-width="1.8" />
      <polygon points="97,76 109,83 109,97 97,104 85,97 85,83" fill="#FF4422" opacity="0.22" />
      <circle cx="97" cy="90" r="4.5" fill="#FAF8F4" />

      <g transform="translate(18, 166)">
        <rect width="158" height="22" rx="5" fill="#13161E" stroke="#252A36" stroke-width="1" />
        <circle cx="14" cy="11" r="3.2" fill="#22C55E" class="prod-beacon" />
        <text x="26" y="14.5" fill="#D5D8E0" class="mono" font-size="9" font-weight="700" letter-spacing="0.8">PROD EDGE // 200 OK</text>
      </g>
    </g>
  </g>
</svg>