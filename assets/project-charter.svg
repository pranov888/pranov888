<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="100%" height="auto">
  <defs>
    <linearGradient id="charter-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EC" />
      <stop offset="100%" stop-color="#EAE4D9" />
    </linearGradient>
    <linearGradient id="charter-sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF8F4" />
    </linearGradient>
    <linearGradient id="charter-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151820" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>

    <style><![CDATA[
      svg { pointer-events: none; user-select: none; }
      .sans { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', 'Lato', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace; }

      .cursor-blink {
        animation: blink 1.05s step-start infinite;
      }
      @keyframes blink {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .bridge-flow {
        stroke-dasharray: 5 4;
        animation: flowSignal 1.4s linear infinite;
      }
      @keyframes flowSignal {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -18; }
      }

      .preview-pill {
        animation: slideEase 4.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes slideEase {
        0%, 12%  { transform: translateX(0px); }
        52%, 82% { transform: translateX(176px); }
        94%, 100%{ transform: translateX(0px); }
      }

      .curve-dot {
        animation: traceCurve 4.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes traceCurve {
        0%, 12%  { transform: translate(0px, 0px); }
        52%, 82% { transform: translate(188px, -74px); }
        94%, 100%{ transform: translate(0px, 0px); }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="476" rx="18" fill="url(#charter-paper)" />
  <rect x="1" y="1" width="1198" height="474" rx="17" fill="none" stroke="#D2CBC0" stroke-width="1.5" />

  <line x1="734" y1="238" x2="778" y2="238" stroke="#FF4422" stroke-width="2" class="bridge-flow" />
  <circle cx="734" cy="238" r="4" fill="#FF4422" />
  <circle cx="778" cy="238" r="4" fill="#FF4422" />

  <!-- LEFT: TYPESCRIPT MANIFESTO WITH EXACT COLUMN ALIGNMENT -->
  <rect x="44" y="42" width="690" height="402" rx="12" fill="#DDD7CA" />

  <g transform="translate(36, 34)">
    <rect width="690" height="402" rx="12" fill="url(#charter-sheet)" stroke="#CFC8BA" stroke-width="1.3" />

    <g transform="translate(28, 34)">
      <text x="0" y="0" fill="#6D685F" class="mono" font-size="11" font-weight="700" letter-spacing="1.2">PRANOV // CRAFT MANIFESTO</text>
      <text x="412" y="0" fill="#E03416" class="mono" font-size="11" font-weight="700">WHOAMI.TS</text>
      <line x1="412" y1="7" x2="478" y2="7" stroke="#FF4422" stroke-width="2" />
      <text x="498" y="0" fill="#8C867B" class="mono" font-size="11" font-weight="700">TOKENS</text>
      <text x="554" y="0" fill="#C4BEB2" class="mono" font-size="11">/</text>
      <text x="572" y="0" fill="#8C867B" class="mono" font-size="11" font-weight="700">MOTION</text>
    </g>

    <line x1="28" y1="54" x2="662" y2="54" stroke="#E5DFD3" stroke-width="1" />

    <!-- Line Numbers -->
    <g transform="translate(32, 92)" fill="#ADA79B" class="mono" font-size="11.5" font-weight="700">
      <text x="0" y="0">01</text><text x="0" y="31">02</text><text x="0" y="62">03</text>
      <text x="0" y="93">04</text><text x="0" y="124">05</text><text x="0" y="155">06</text>
      <text x="0" y="186">07</text><text x="0" y="217">08</text>
    </g>
    <line x1="62" y1="74" x2="62" y2="332" stroke="#EDE8DE" stroke-width="1.2" />

    <!-- Aligned Code Block -->
    <g transform="translate(78, 92)" class="mono" font-size="12.5" font-weight="700">
      <text x="0" y="0"><tspan fill="#E03416">const</tspan> <tspan fill="#111318">pranov</tspan> <tspan fill="#E03416">=</tspan> <tspan fill="#111318">{</tspan></text>

      <text x="16" y="31" fill="#62656E">role</text>
      <text x="108" y="31" fill="#E03416">:</text>
      <text x="122" y="31" fill="#111318">"UI/UX Designer &amp; Frontend Developer"<tspan fill="#8C867B">,</tspan></text>

      <text x="16" y="62" fill="#62656E">portfolio</text>
      <text x="108" y="62" fill="#E03416">:</text>
      <text x="122" y="62" fill="#111318">"pranovdesign.vercel.app"<tspan fill="#8C867B">,</tspan></text>

      <text x="16" y="93" fill="#62656E">philosophy</text>
      <text x="108" y="93" fill="#E03416">:</text>
      <text x="122" y="93" fill="#111318">"Design is not how it looks. It's how it works."<tspan fill="#8C867B">,</tspan></text>

      <text x="16" y="124" fill="#62656E">currently</text>
      <text x="108" y="124" fill="#E03416">:</text>
      <text x="122" y="124" fill="#111318">"Building things I can't stop thinking about."<tspan fill="#8C867B">,</tspan></text>

      <text x="16" y="155" fill="#62656E">focus</text>
      <text x="108" y="155" fill="#E03416">:</text>
      <text x="122" y="155"><tspan fill="#E03416">[</tspan><tspan fill="#15803D">"Motion Design"</tspan><tspan fill="#8C867B">, </tspan><tspan fill="#15803D">"Design Systems"</tspan><tspan fill="#8C867B">, </tspan><tspan fill="#15803D">"Spatial UI"</tspan><tspan fill="#E03416">]</tspan><tspan fill="#8C867B">,</tspan></text>

      <text x="16" y="186" fill="#62656E">rhythm</text>
      <text x="108" y="186" fill="#E03416">:</text>
      <text x="122" y="186" fill="#111318">"Debug at midnight, ship before sunrise."</text>

      <text x="0" y="217" fill="#111318">};</text>
      <rect x="24" y="205" width="8" height="15" rx="1.5" fill="#FF4422" class="cursor-blink" />
    </g>

    <line x1="28" y1="352" x2="662" y2="352" stroke="#E5DFD3" stroke-width="1" />
    <g transform="translate(28, 380)">
      <text x="0" y="0" fill="#6D685F" class="mono" font-size="10.5" font-weight="700">EDITION 03 // ARCHITECTURE CHARTER</text>
      <text x="634" y="0" text-anchor="end" fill="#E03416" class="mono" font-size="10.5" font-weight="700">FIGMA · TYPESCRIPT · 60FPS</text>
    </g>
  </g>

  <!-- RIGHT: MOTION & CRAFT SPECIMEN -->
  <g transform="translate(778, 34)">
    <rect width="386" height="402" rx="12" fill="url(#charter-dark)" stroke="#242934" stroke-width="1.3" />

    <text x="24" y="34" fill="#8E95A2" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.1">SPECIMEN // MOTION &amp; SCALE</text>
    <text x="362" y="34" text-anchor="end" fill="#22C55E" class="mono" font-size="10.5" font-weight="700">[60FPS]</text>
    <line x1="24" y1="54" x2="362" y2="54" stroke="#222632" stroke-width="1" />

    <g transform="translate(24, 70)">
      <rect width="338" height="176" rx="10" fill="#090A0D" stroke="#1E232E" stroke-width="1" />

      <rect x="20" y="18" width="298" height="22" rx="6" fill="#12151D" stroke="#222734" stroke-width="1" />
      <g class="preview-pill">
        <rect x="24" y="21" width="114" height="16" rx="4" fill="#FF4422" />
        <text x="81" y="32.5" text-anchor="middle" fill="#FAF8F4" class="mono" font-size="8.5" font-weight="700">EASE_OUT_EXPO</text>
      </g>

      <line x1="74" y1="150" x2="268" y2="150" stroke="#232835" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="74" y1="64" x2="74" y2="150" stroke="#232835" stroke-width="1" stroke-dasharray="3 3" />

      <line x1="74" y1="150" x2="115" y2="76" stroke="#4D5466" stroke-width="1.2" />
      <line x1="262" y1="76" x2="142" y2="76" stroke="#4D5466" stroke-width="1.2" />
      <circle cx="115" cy="76" r="3.5" fill="#090A0D" stroke="#FF4422" stroke-width="1.5" />
      <circle cx="142" cy="76" r="3.5" fill="#090A0D" stroke="#FF4422" stroke-width="1.5" />

      <path d="M 74 150 C 115 76, 142 76, 262 76" fill="none" stroke="#FF4422" stroke-width="2.6" stroke-linecap="round" />

      <g class="curve-dot">
        <circle cx="74" cy="150" r="6" fill="#FF4422" opacity="0.28" />
        <circle cx="74" cy="150" r="3.5" fill="#FAF8F4" stroke="#FF4422" stroke-width="1.5" />
      </g>

      <text x="20" y="164" fill="#6F7685" class="mono" font-size="8.5">P0(0,0)</text>
      <text x="318" y="164" text-anchor="end" fill="#6F7685" class="mono" font-size="8.5">P3(1,1)</text>
    </g>

    <!-- Aligned Spec Readout -->
    <g transform="translate(24, 272)" class="mono" font-size="10.5" font-weight="700">
      <text x="0" y="0" fill="#747C8B">IDENTITY</text><text x="74" y="0" fill="#747C8B">:</text><text x="88" y="0" fill="#FAF8F4">PRANOV PRAHALADH</text>
      <text x="0" y="21" fill="#747C8B">SPECIALTY</text><text x="74" y="21" fill="#747C8B">:</text><text x="88" y="21" fill="#FF5738">FULL-STACK &amp; UI SYSTEMS</text>
      <text x="0" y="42" fill="#747C8B">DISCIPLINE</text><text x="74" y="42" fill="#747C8B">:</text><text x="88" y="42" fill="#FAF8F4">UI/UX &amp; FRONTEND ARCH</text>
      <text x="0" y="63" fill="#747C8B">BENCHMARK</text><text x="74" y="63" fill="#747C8B">:</text><text x="88" y="63" fill="#22C55E">WCAG AA · ZERO CLS</text>
    </g>

    <line x1="24" y1="352" x2="362" y2="352" stroke="#222632" stroke-width="1" />

    <g transform="translate(24, 364)">
      <rect width="338" height="28" rx="6" fill="#171A22" stroke="#FF4422" stroke-width="1.1" />
      <text x="169" y="18" text-anchor="middle" fill="#FAF8F4" class="mono" font-size="10" font-weight="700" letter-spacing="1">DESIGN TOKENS  &lt;-&gt;  PRODUCTION CODE</text>
    </g>
  </g>
</svg>