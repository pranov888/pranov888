<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 276" width="100%" height="auto">
  <defs>
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EC" />
      <stop offset="100%" stop-color="#EAE4D9" />
    </linearGradient>

    <linearGradient id="obsidian-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161921" />
      <stop offset="100%" stop-color="#0C0E12" />
    </linearGradient>

    <linearGradient id="obsidian-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4422" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF4422" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF4422" stop-opacity="0" />
    </linearGradient>

    <style><![CDATA[
      svg { pointer-events: none; user-select: none; }
      .sans { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', 'Lato', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace; }

      .caliper-slide {
        animation: slideCaliper 5s ease-in-out infinite alternate;
      }
      @keyframes slideCaliper {
        0%   { transform: translateX(0px); }
        100% { transform: translateX(46px); }
      }

      .ship-dot { animation: dotBeat 4.8s ease-in-out infinite; }
      .ship-d1 { animation-delay: 0s; }
      .ship-d2 { animation-delay: 0.4s; }
      .ship-d3 { animation-delay: 0.8s; }
      .ship-d4 { animation-delay: 1.2s; }
      .ship-d5 { animation-delay: 1.6s; }
      .ship-d6 { animation-delay: 2.0s; }
      @keyframes dotBeat {
        0%, 100% { opacity: 0.72; }
        50%      { opacity: 1; }
      }

      .fps-bead {
        animation: fpsGlide 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes fpsGlide {
        0%, 10%  { transform: translateX(0px); }
        55%, 85% { transform: translateX(182px); }
        95%, 100%{ transform: translateX(0px); }
      }

      .star-spin {
        animation: starRotate 14s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes starRotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="276" rx="18" fill="url(#paper-bg)" />
  <rect x="1" y="1" width="1198" height="274" rx="17" fill="none" stroke="#D2CBC0" stroke-width="1.5" />

  <g stroke="#D2CBC0" stroke-width="1.1">
    <line x1="296" y1="24" x2="296" y2="252" />
    <line x1="592" y1="24" x2="592" y2="252" />
    <line x1="888" y1="24" x2="888" y2="252" />
  </g>
  <g fill="#A8A195" class="mono" font-size="11" text-anchor="middle">
    <text x="296" y="21">+</text><text x="296" y="264">+</text>
    <text x="592" y="21">+</text><text x="592" y="264">+</text>
    <text x="888" y="21">+</text><text x="888" y="264">+</text>
  </g>

  <!-- 01: EXPERIENCE -->
  <g transform="translate(36, 36)">
    <text x="0" y="12" fill="#6D685F" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.6">01 // EXPERIENCE</text>
    <text x="-3" y="88" fill="#111318" class="sans" font-size="72" font-weight="900" letter-spacing="-3">1.5<tspan fill="#FF4422">+</tspan></text>
    <text x="0" y="114" fill="#E03416" class="mono" font-size="11" font-weight="700" letter-spacing="1.4">YEARS ACTIVE</text>

    <text x="0" y="142" fill="#2A2D34" class="sans" font-size="12.5" font-weight="600">Frontend engineering, design systems,</text>
    <text x="0" y="160" fill="#62656E" class="sans" font-size="12.5" font-weight="500">and responsive full-stack architecture.</text>

    <g transform="translate(0, 186)">
      <line x1="0" y1="12" x2="220" y2="12" stroke="#CBC4B7" stroke-width="1.5" />
      <line x1="0" y1="6" x2="0" y2="18" stroke="#8E887D" stroke-width="1.2" />
      <line x1="55" y1="8" x2="55" y2="16" stroke="#8E887D" stroke-width="1" />
      <line x1="110" y1="6" x2="110" y2="18" stroke="#8E887D" stroke-width="1.2" />
      <line x1="165" y1="8" x2="165" y2="16" stroke="#8E887D" stroke-width="1" />
      <line x1="220" y1="6" x2="220" y2="18" stroke="#111318" stroke-width="1.4" />
      <rect x="0" y="10" width="168" height="4" rx="2" fill="#111318" />
      <g class="caliper-slide">
        <rect x="136" y="4" width="10" height="16" rx="2" fill="#FF4422" />
        <line x1="141" y1="0" x2="141" y2="24" stroke="#FF4422" stroke-width="1.2" />
      </g>
    </g>
  </g>

  <!-- 02: SHIPPED -->
  <g transform="translate(332, 36)">
    <text x="0" y="12" fill="#6D685F" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.6">02 // SHIPPED</text>
    <text x="-3" y="88" fill="#111318" class="sans" font-size="72" font-weight="900" letter-spacing="-3">30<tspan fill="#FF4422">+</tspan></text>
    <text x="0" y="114" fill="#E03416" class="mono" font-size="11" font-weight="700" letter-spacing="1.4">BUILT &amp; DEPLOYED</text>

    <text x="0" y="142" fill="#2A2D34" class="sans" font-size="12.5" font-weight="600">Full-stack web apps, SaaS platforms,</text>
    <text x="0" y="160" fill="#62656E" class="sans" font-size="12.5" font-weight="500">REST APIs and creative tooling.</text>

    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d1" />
        <rect x="15" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d2" />
        <rect x="30" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d3" />
        <rect x="45" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d4" />
        <rect x="60" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d5" />
        <rect x="75" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d6" />
        <rect x="90" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d1" />
        <rect x="105" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d2" />
        <rect x="120" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d3" />
        <rect x="135" y="0" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d4" />
        <rect x="0" y="10" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d5" />
        <rect x="15" y="10" width="8" height="6" rx="1.5" fill="#8E887D" class="ship-dot ship-d6" />
        <rect x="30" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d1" />
        <rect x="45" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d2" />
        <rect x="60" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d3" />
        <rect x="75" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d4" />
        <rect x="90" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d5" />
        <rect x="105" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d6" />
        <rect x="120" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d1" />
        <rect x="135" y="10" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d2" />
        <rect x="0" y="20" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d3" />
        <rect x="15" y="20" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d4" />
        <rect x="30" y="20" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d5" />
        <rect x="45" y="20" width="8" height="6" rx="1.5" fill="#111318" class="ship-dot ship-d6" />
        <rect x="60" y="20" width="8" height="6" rx="1.5" fill="#FF4422" class="ship-dot ship-d1" />
        <rect x="75" y="20" width="8" height="6" rx="1.5" fill="#FF4422" class="ship-dot ship-d2" />
        <rect x="90" y="20" width="8" height="6" rx="1.5" fill="#FF4422" class="ship-dot ship-d3" />
        <rect x="105" y="20" width="8" height="6" rx="1.5" fill="#FF4422" class="ship-dot ship-d4" />
        <rect x="120" y="20" width="8" height="6" rx="1.5" fill="#FF4422" class="ship-dot ship-d5" />
        <rect x="135" y="20" width="8" height="6" rx="1.5" fill="#FF4422" class="ship-dot ship-d6" />
    </g>
  </g>

  <!-- 03: KINETIC MOTION -->
  <g transform="translate(628, 36)">
    <text x="0" y="12" fill="#6D685F" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.6">03 // FIDELITY</text>
    <text x="-3" y="88" fill="#111318" class="sans" font-size="72" font-weight="900" letter-spacing="-3">60<tspan font-size="40" fill="#FF4422" letter-spacing="-1">FPS</tspan></text>
    <text x="0" y="114" fill="#E03416" class="mono" font-size="11" font-weight="700" letter-spacing="1.4">KINETIC MOTION</text>

    <text x="0" y="142" fill="#2A2D34" class="sans" font-size="12.5" font-weight="600">Spring physics &amp; fluid interactions,</text>
    <text x="0" y="160" fill="#62656E" class="sans" font-size="12.5" font-weight="500">WebGL canvases &amp; zero layout shift.</text>

    <g transform="translate(0, 186)">
      <rect x="0" y="9" width="220" height="6" rx="3" fill="#DDD7CA" />
      <rect x="0" y="9" width="220" height="6" rx="3" fill="none" stroke="#C9C2B4" stroke-width="0.8" />
      <circle cx="10" cy="12" r="2.5" fill="#8E887D" />
      <circle cx="210" cy="12" r="2.5" fill="#111318" />
      <g class="fps-bead">
        <rect x="8" y="5" width="22" height="14" rx="7" fill="#FF4422" />
        <circle cx="19" cy="12" r="2.5" fill="#FAF8F4" />
      </g>
    </g>
  </g>

  <!-- 04: OBSIDIAN FEATURED INLAY -->
  <g transform="translate(904, 14)">
    <rect width="282" height="248" rx="13" fill="url(#obsidian-card)" stroke="#242934" stroke-width="1.2" />
    <line x1="28" y1="1" x2="254" y2="1" stroke="url(#obsidian-sheen)" stroke-width="1.5" />

    <g transform="translate(242, 34)" class="star-spin">
      <path d="M 0 -9 L 2.2 -2.2 L 9 0 L 2.2 2.2 L 0 9 L -2.2 2.2 L -9 0 L -2.2 -2.2 Z" fill="#FF4422" />
    </g>

    <g transform="translate(26, 24)">
      <text x="0" y="12" fill="#8E95A2" class="mono" font-size="10.5" font-weight="700" letter-spacing="1.6">04 // DEDICATION</text>
      <text x="-3" y="88" fill="#FAF8F4" class="sans" font-size="68" font-weight="900" letter-spacing="-3">5.6k<tspan fill="#FF4422" font-size="48">+</tspan></text>
      <text x="0" y="114" fill="#FAF8F4" class="mono" font-size="11" font-weight="700" letter-spacing="1.4">HOURS IN THE CRAFT</text>

      <text x="0" y="142" fill="#D5D8E0" class="sans" font-size="12.5" font-weight="600">Design in Figma, code in TypeScript,</text>
      <text x="0" y="160" fill="#8E95A2" class="sans" font-size="12.5" font-weight="500">debug at 2 AM &amp; ship by sunrise.</text>

      <line x1="0" y1="184" x2="230" y2="184" stroke="#222632" stroke-width="1" />
      <text x="0" y="203" fill="#FF5738" class="mono" font-size="9.5" font-weight="700" letter-spacing="1.1">CONTINUOUS CRAFT // AUG 2023 — NOW</text>
    </g>
  </g>
</svg>