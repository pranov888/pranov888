<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto">
  <defs>
    <!-- Background Gradient: Light Mocha Cream -->
    <linearGradient id="metric-light-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F3EA" />
      <stop offset="100%" stop-color="#EFE4D3" />
    </linearGradient>

    <!-- Deep Burgundy Luxury Highlight Card Gradient -->
    <linearGradient id="burgundy-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87353F" />
      <stop offset="50%" stop-color="#722F37" />
      <stop offset="100%" stop-color="#521D24" />
    </linearGradient>

    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap');
      svg { pointer-events: none; user-select: none; }

      .heavy-num {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -3px;
      }
      .mono-tag {
        font-family: 'Space Mono', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
      .metric-label {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .body-desc {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: -0.2px;
        line-height: 1.4;
      }

      /* Kinetic Differentiated Card Movements (8s Cycle) */
      .roll-num-1 { animation: rollCraft 8s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
      .roll-num-2 { animation: rollShipped 8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .roll-num-3 { animation: rollFidelity 8s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .roll-num-4 { animation: rollDedication 8s cubic-bezier(0.2, 1, 0.3, 1) infinite; }

      /* 01 CRAFT: Rhythmic Calibrated Stepping (Clean Center Stops) */
      @keyframes rollCraft {
        0%, 5%   { transform: translateY(360px); }
        8.5%, 12%{ transform: translateY(240px); }
        15.5%, 19%{ transform: translateY(120px); }
        23%, 90% { transform: translateY(0px); }
        95%, 100%{ transform: translateY(360px); }
      }

      /* 02 SHIPPED: High-Velocity Continuous Odometer Spin */
      @keyframes rollShipped {
        0%, 14%  { transform: translateY(360px); }
        28%, 90% { transform: translateY(0px); }
        95%, 100%{ transform: translateY(360px); }
      }

      /* 03 FIDELITY: 60FPS Fluid Momentum Surge */
      @keyframes rollFidelity {
        0%, 22%  { transform: translateY(360px); }
        29%, 33% { transform: translateY(120px); }
        40%, 90% { transform: translateY(0px); }
        95%, 100%{ transform: translateY(360px); }
      }

      /* 04 DEDICATION: Grand Finale Surge & Hero Reveal */
      @keyframes rollDedication {
        0%, 34%  { transform: translateY(360px); }
        41%, 45% { transform: translateY(120px); }
        52%, 90% { transform: translateY(0px); }
        95%, 100%{ transform: translateY(360px); }
      }

      /* Celestial Floating Star with Synchronized Hero Flare */
      .star-float {
        animation: starPulse 8s ease-in-out infinite;
        transform-origin: 1146px 48px;
      }
      @keyframes starPulse {
        0%, 45%  { transform: translateY(0px) rotate(0deg) scale(1); }
        48%      { transform: translateY(-4px) rotate(45deg) scale(1.15); }
        52%      { transform: translateY(-2px) rotate(360deg) scale(1.25); }
        56%      { transform: translateY(0px) rotate(360deg) scale(1); }
        88%      { transform: translateY(-3px) rotate(375deg) scale(1.05); }
        95%, 100%{ transform: translateY(0px) rotate(0deg) scale(1); }
      }

      /* Subtle Specular Rim Accent on Hero Card */
      .burgundy-border {
        animation: borderGlow 8s ease-in-out infinite;
      }
      @keyframes borderGlow {
        0%, 48%  { stroke: rgba(250, 246, 238, 0.2); stroke-width: 1; }
        52%      { stroke: rgba(250, 246, 238, 0.6); stroke-width: 1.5; }
        58%      { stroke: rgba(250, 246, 238, 0.2); stroke-width: 1; }
        100%     { stroke: rgba(250, 246, 238, 0.2); stroke-width: 1; }
      }
    ]]></style>

    <clipPath id="clip-metric-1"><rect x="-10" y="20" width="240" height="94" /></clipPath>
    <clipPath id="clip-metric-2"><rect x="-10" y="20" width="240" height="94" /></clipPath>
    <clipPath id="clip-metric-3"><rect x="-10" y="20" width="260" height="94" /></clipPath>
    <clipPath id="clip-metric-4"><rect x="-10" y="20" width="240" height="94" /></clipPath>
  </defs>

  <!-- Container Base with Light Mocha Cream -->
  <rect width="1200" height="280" fill="url(#metric-light-bg)" rx="14" />
  <rect x="1" y="1" width="1198" height="278" fill="none" stroke="#D6C4AE" stroke-width="1.5" rx="13" />

  <!-- Divider Lines in Cosmic Latte Tone with Swiss Crosshair Anchors -->
  <line x1="300" y1="24" x2="300" y2="256" stroke="#D6C4AE" stroke-width="1.2" />
  <text x="300" y="22" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>
  <text x="300" y="268" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <line x1="600" y1="24" x2="600" y2="256" stroke="#D6C4AE" stroke-width="1.2" />
  <text x="600" y="22" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>
  <text x="600" y="268" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <line x1="900" y1="24" x2="900" y2="256" stroke="#D6C4AE" stroke-width="1.2" />
  <text x="900" y="22" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>
  <text x="900" y="268" fill="#B7A89A" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <!-- ==================== COLUMN 1: EXPERIENCE / CRAFT ==================== -->
  <g transform="translate(42, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#886D5B" class="mono-tag">// 01 CRAFT</text>
    
    <!-- Ultra Bold Large Number -->
    <g clip-path="url(#clip-metric-1)">
      <g class="roll-num-1">
        <text x="0" y="-262" fill="#241117" class="heavy-num" font-size="82">0.5<tspan fill="#722F37">+</tspan></text>
        <text x="0" y="-142" fill="#241117" class="heavy-num" font-size="82">0.8<tspan fill="#722F37">+</tspan></text>
        <text x="0" y="-22" fill="#241117" class="heavy-num" font-size="82">1.0<tspan fill="#722F37">+</tspan></text>
        <text x="0" y="98" fill="#241117" class="heavy-num" font-size="82">1.5<tspan fill="#722F37">+</tspan></text>
      </g>
    </g>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#722F37" class="metric-label">YEARS ACTIVE</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#3D2028" class="body-desc">
      Frontend engineering, design systems,
    </text>
    <text x="0" y="178" fill="#785A48" class="body-desc">
      responsive full-stack architecture.
    </text>
  </g>

  <!-- ==================== COLUMN 2: PRODUCTION PROJECTS ==================== -->
  <g transform="translate(342, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#886D5B" class="mono-tag">// 02 SHIPPED</text>
    
    <!-- Ultra Bold Large Number -->
    <g clip-path="url(#clip-metric-2)">
      <g class="roll-num-2">
        <text x="0" y="-262" fill="#241117" class="heavy-num" font-size="88">08<tspan fill="#722F37">+</tspan></text>
        <text x="0" y="-142" fill="#241117" class="heavy-num" font-size="88">16<tspan fill="#722F37">+</tspan></text>
        <text x="0" y="-22" fill="#241117" class="heavy-num" font-size="88">24<tspan fill="#722F37">+</tspan></text>
        <text x="0" y="98" fill="#241117" class="heavy-num" font-size="88">30<tspan fill="#722F37">+</tspan></text>
      </g>
    </g>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#722F37" class="metric-label">BUILT &amp; DEPLOYED</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#3D2028" class="body-desc">
      Full-stack web apps, SaaS dashboards,
    </text>
    <text x="0" y="178" fill="#785A48" class="body-desc">
      REST APIs and creative tooling.
    </text>
  </g>

  <!-- ==================== COLUMN 3: MOTION & FIDELITY ==================== -->
  <g transform="translate(642, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#886D5B" class="mono-tag">// 03 FIDELITY</text>
    
    <!-- Ultra Bold Large Number -->
    <g clip-path="url(#clip-metric-3)">
      <g class="roll-num-3">
        <text x="0" y="-262" fill="#241117" class="heavy-num" font-size="88">24<tspan font-size="52" fill="#722F37">FPS</tspan></text>
        <text x="0" y="-142" fill="#241117" class="heavy-num" font-size="88">30<tspan font-size="52" fill="#722F37">FPS</tspan></text>
        <text x="0" y="-22" fill="#241117" class="heavy-num" font-size="88">48<tspan font-size="52" fill="#722F37">FPS</tspan></text>
        <text x="0" y="98" fill="#241117" class="heavy-num" font-size="88">60<tspan font-size="52" fill="#722F37">FPS</tspan></text>
      </g>
    </g>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#722F37" class="metric-label">KINETIC MOTION</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#3D2028" class="body-desc">
      Kinetic physics &amp; GSAP animations,
    </text>
    <text x="0" y="178" fill="#785A48" class="body-desc">
      WebGL canvases &amp; pixel perfection.
    </text>
  </g>

  <!-- ==================== COLUMN 4: DEEP BURGUNDY HIGHLIGHT CARD ==================== -->
  <!-- Card Background with Rounded Corners -->
  <rect x="914" y="14" width="272" height="252" rx="10" fill="url(#burgundy-card-grad)" />
  <rect x="915" y="15" width="270" height="250" rx="9" fill="none" stroke="rgba(250, 246, 238, 0.2)" stroke-width="1" class="burgundy-border" />

  <!-- Floating Star -->
  <g class="star-float">
    <text x="1146" y="48" fill="#FAF6EE" font-size="20" text-anchor="middle">✦</text>
  </g>

  <g transform="translate(936, 38)">
    <!-- Top Index & Category Badge -->
    <text x="0" y="14" fill="#E8DCC6" class="mono-tag">// 04 DEDICATION</text>
    
    <!-- Ultra Bold Large Number (Short & punchy, no clipping) -->
    <g clip-path="url(#clip-metric-4)">
      <g class="roll-num-4">
        <text x="0" y="-262" fill="#FAF6EE" class="heavy-num" font-size="80">1.2k<tspan font-size="52" fill="#FAF6EE">+</tspan></text>
        <text x="0" y="-142" fill="#FAF6EE" class="heavy-num" font-size="80">2.4k<tspan font-size="52" fill="#FAF6EE">+</tspan></text>
        <text x="0" y="-22" fill="#FAF6EE" class="heavy-num" font-size="80">3.8k<tspan font-size="52" fill="#FAF6EE">+</tspan></text>
        <text x="0" y="98" fill="#FAF6EE" class="heavy-num" font-size="80">5.6k<tspan font-size="52" fill="#FAF6EE">+</tspan></text>
      </g>
    </g>
    
    <!-- Bold Sub-label -->
    <text x="0" y="128" fill="#FAF6EE" class="metric-label">HOURS IN THE CRAFT</text>
    
    <!-- Crisp Meaningful Description -->
    <text x="0" y="158" fill="#FAF6EE" class="body-desc">
      Design in Figma, code in VS Code,
    </text>
    <text x="0" y="178" fill="#E8DCC6" class="body-desc">
      debug at 2 AM &amp; ship by sunrise.
    </text>
  </g>
</svg>