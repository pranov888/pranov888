<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="auto">
  <defs>
    <linearGradient id="stealth-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EC" />
      <stop offset="100%" stop-color="#EAE4D9" />
    </linearGradient>

    <linearGradient id="stealth-sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF8F4" />
    </linearGradient>

    <linearGradient id="stealth-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>

    <clipPath id="term-viewport">
      <rect x="20" y="38" width="1080" height="72" rx="4" />
    </clipPath>

    <style><![CDATA[
      svg { pointer-events: none; user-select: none; }
      .sans { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', 'Lato', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'DejaVu Sans Mono', ui-monospace, Menlo, Consolas, monospace; }

      .beacon-dot { animation: beacon 2.4s ease-in-out infinite; }
      @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

      .cursor-blink { animation: blink 1s step-start infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .term-msg-1, .term-msg-2, .term-msg-3 {
        will-change: transform, opacity;
        animation: rollMsg 24s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
      }
      .term-msg-1 { animation-delay: 0s; }
      .term-msg-2 { animation-delay: -16s; }
      .term-msg-3 { animation-delay: -8s; }
      @keyframes rollMsg {
        0%, 28%      { transform: translateY(0px); opacity: 1; }
        33%          { transform: translateY(-35px); opacity: 0; }
        35%          { transform: translateY(-35px); opacity: 0; }
        37%          { transform: translateY(66px); opacity: 0; }
        62%          { transform: translateY(66px); opacity: 0; }
        66.67%       { transform: translateY(31px); opacity: 1; }
        94.67%       { transform: translateY(31px); opacity: 1; }
        99.67%, 100% { transform: translateY(0px); opacity: 1; }
      }

      @keyframes tileSweep {
        0%, 18%  { stroke: #FF4422; stroke-width: 1.6px; fill: #FFFFFF; }
        24%, 94% { stroke: #DDD6C8; stroke-width: 1px; fill: #F7F4EE; }
        100%     { stroke: #FF4422; stroke-width: 1.6px; fill: #FFFFFF; }
      }
      .tile-1 { animation: tileSweep 8s 0s ease-in-out infinite; }
      .tile-2 { animation: tileSweep 8s -6s ease-in-out infinite; }
      .tile-4 { animation: tileSweep 8s -4s ease-in-out infinite; }
      .tile-3 { animation: tileSweep 8s -2s ease-in-out infinite; }
    ]]></style>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#stealth-paper)" />
  <rect x="1" y="1" width="1198" height="618" rx="17" fill="none" stroke="#D2CBC0" stroke-width="1.5" />

  <!-- HEADER -->
  <rect x="40" y="42" width="8" height="8" rx="2" fill="#FF4422" class="beacon-dot" />
  <text x="58" y="50" fill="#111318" class="mono" font-size="13.5" font-weight="700" letter-spacing="1.4">&gt; GIT LOG --ONELINE --STATS // PRIVATE INFRASTRUCTURE</text>
  <text x="1160" y="50" text-anchor="end" fill="#E03416" class="mono" font-size="11.5" font-weight="700" letter-spacing="1">STEALTH MODE // ENGAGED</text>
  <line x1="40" y1="74" x2="1160" y2="74" stroke="#D2CBC0" stroke-width="1.1" />

  <!-- DARK TERMINAL INLAY -->
  <g transform="translate(40, 92)">
    <rect width="1120" height="146" rx="12" fill="url(#stealth-dark)" stroke="#242934" stroke-width="1.2" />
    <rect width="1120" height="32" rx="12" fill="#191D26" />
    <rect y="20" width="1120" height="12" fill="#191D26" />
    <line x1="0" y1="32" x2="1120" y2="32" stroke="#252A36" stroke-width="1" />

    <text x="22" y="20.5" fill="#8E95A2" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.9">TERMINAL // COMMIT_VERIFICATION.LOG</text>
    <text x="284" y="20.5" fill="#FF4422" class="mono cursor-blink" font-size="12" font-weight="700">_</text>
    <text x="1096" y="20.5" text-anchor="end" fill="#FF5738" class="mono" font-size="10.5" font-weight="700">PRANOV888 // PRIVATE ENGINE</text>

    <g clip-path="url(#term-viewport)">
      <g class="term-msg-1">
        <rect x="22" y="45" width="1076" height="27" rx="5" fill="#2A1417" stroke="#5E2328" stroke-width="0.9" />
        <text x="38" y="62.5" fill="#FCA5A5" class="mono" font-size="12.5" font-weight="700">- Contribution graph may appear suspiciously empty.</text>
      </g>
      <g class="term-msg-2">
        <rect x="22" y="45" width="1076" height="27" rx="5" fill="#10291B" stroke="#1E5C3A" stroke-width="0.9" />
        <text x="38" y="62.5" fill="#86EFAC" class="mono" font-size="12.5" font-weight="700">+ Not a bug. I ship inside private client repositories and enterprise systems.</text>
      </g>
      <g class="term-msg-3">
        <rect x="22" y="45" width="1076" height="27" rx="5" fill="#2A1D11" stroke="#66401B" stroke-width="0.9" />
        <text x="38" y="62.5" fill="#FDBA74" class="mono" font-size="12.5" font-weight="700">~ 1,420+ verified releases shipped across confidential client infrastructure.</text>
      </g>
    </g>

    <line x1="24" y1="118" x2="24" y2="134" stroke="#FF4422" stroke-width="3" stroke-linecap="round" />
    <text x="36" y="130" fill="#E6E4DD" class="sans" font-size="13.5" font-weight="600" font-style="italic">“Sorry, you can't see my contributions. My commits are classified. Think of it as stealth mode.”</text>
  </g>

  <!-- MIDDLE ROW: DUAL ANALYTICAL BENTO -->
  <!-- Left Card -->
  <g transform="translate(40, 256)">
    <rect width="546" height="236" rx="12" fill="url(#stealth-sheet)" stroke="#CFC8BA" stroke-width="1.2" />
    <text x="24" y="29" fill="#111318" class="mono" font-size="11.5" font-weight="700" letter-spacing="1">01 // REPOSITORY &amp; COMMIT METRICS</text>
    <line x1="24" y1="42" x2="522" y2="42" stroke="#E5DFD3" stroke-width="1" />

    <g transform="translate(24, 56)">
      <rect class="tile-1" width="239" height="74" rx="8" />
      <text x="18" y="37" fill="#111318" class="sans" font-size="29" font-weight="900">1,420<tspan fill="#FF4422">+</tspan></text>
      <text x="18" y="57" fill="#6D685F" class="mono" font-size="10" font-weight="700">COMMITS (PRIVATE / CLIENT)</text>
    </g>

    <g transform="translate(283, 56)">
      <rect class="tile-2" width="239" height="74" rx="8" />
      <text x="18" y="37" fill="#111318" class="sans" font-size="29" font-weight="900">85<tspan fill="#FF4422">+</tspan></text>
      <text x="18" y="57" fill="#6D685F" class="mono" font-size="10" font-weight="700">PULL REQUESTS MERGED</text>
    </g>

    <g transform="translate(24, 144)">
      <rect class="tile-3" width="239" height="74" rx="8" />
      <text x="18" y="37" fill="#111318" class="sans" font-size="29" font-weight="900">99.8<tspan fill="#FF4422">%</tspan></text>
      <text x="18" y="57" fill="#6D685F" class="mono" font-size="10" font-weight="700">COMMIT CONSISTENCY</text>
    </g>

    <g transform="translate(283, 144)">
      <rect class="tile-4" width="239" height="74" rx="8" />
      <text x="18" y="37" fill="#111318" class="sans" font-size="29" font-weight="900">A<tspan fill="#FF4422">+</tspan></text>
      <text x="18" y="57" fill="#6D685F" class="mono" font-size="10" font-weight="700">CODE QUALITY &amp; QA GRADE</text>
    </g>
  </g>

  <!-- Right Card: Multi-Segment Distribution + Bars -->
  <g transform="translate(614, 256)">
    <rect width="546" height="236" rx="12" fill="url(#stealth-sheet)" stroke="#CFC8BA" stroke-width="1.2" />
    <text x="24" y="29" fill="#111318" class="mono" font-size="11.5" font-weight="700" letter-spacing="1">02 // TOP LANGUAGES &amp; ENGINE SHARE</text>
    <line x1="24" y1="42" x2="522" y2="42" stroke="#E5DFD3" stroke-width="1" />

    <!-- Multi-Segment 100% Proportional Summary Bar -->
    <g transform="translate(24, 56)">
      <rect x="0"   y="0" width="206" height="10" rx="3" fill="#FF4422" />
      <rect x="210" y="0" width="137" height="10" rx="3" fill="#EA7B46" />
      <rect x="351" y="0" width="88"  height="10" rx="3" fill="#111318" />
      <rect x="443" y="0" width="55"  height="10" rx="3" fill="#8C867B" />
    </g>

    <!-- Individual Telemetry Rows -->
    <g transform="translate(24, 82)">
      <circle cx="7" cy="9" r="4.5" fill="#FF4422" />
      <text x="20" y="13" fill="#111318" class="sans" font-size="14" font-weight="700">TypeScript</text>
      <text x="498" y="13" text-anchor="end" fill="#E03416" class="mono" font-size="12.5" font-weight="700">42%</text>
      <rect x="0" y="21" width="498" height="6" rx="3" fill="#E8E2D6" />
      <rect x="0" y="21" width="209" height="6" rx="3" fill="#FF4422" />
    </g>

    <g transform="translate(24, 120)">
      <circle cx="7" cy="9" r="4.5" fill="#EA7B46" />
      <text x="20" y="13" fill="#111318" class="sans" font-size="14" font-weight="700">JavaScript</text>
      <text x="498" y="13" text-anchor="end" fill="#B85627" class="mono" font-size="12.5" font-weight="700">28%</text>
      <rect x="0" y="21" width="498" height="6" rx="3" fill="#E8E2D6" />
      <rect x="0" y="21" width="139" height="6" rx="3" fill="#EA7B46" />
    </g>

    <g transform="translate(24, 158)">
      <circle cx="7" cy="9" r="4.5" fill="#111318" />
      <text x="20" y="13" fill="#111318" class="sans" font-size="14" font-weight="700">Python</text>
      <text x="498" y="13" text-anchor="end" fill="#111318" class="mono" font-size="12.5" font-weight="700">18%</text>
      <rect x="0" y="21" width="498" height="6" rx="3" fill="#E8E2D6" />
      <rect x="0" y="21" width="90" height="6" rx="3" fill="#111318" />
    </g>

    <g transform="translate(24, 196)">
      <circle cx="7" cy="9" r="4.5" fill="#8C867B" />
      <text x="20" y="13" fill="#111318" class="sans" font-size="14" font-weight="700">UI &amp; Design Systems</text>
      <text x="498" y="13" text-anchor="end" fill="#6D685F" class="mono" font-size="12.5" font-weight="700">12%</text>
      <rect x="0" y="21" width="498" height="6" rx="3" fill="#E8E2D6" />
      <rect x="0" y="21" width="60" height="6" rx="3" fill="#8C867B" />
    </g>
  </g>

  <!-- BOTTOM HORIZON BAR (Obsidian Contrast Strip, Zero Duplicate Stats) -->
  <g transform="translate(40, 508)">
    <rect width="1120" height="88" rx="12" fill="url(#stealth-dark)" stroke="#242934" stroke-width="1.2" />

    <g transform="translate(186, 0)" text-anchor="middle">
      <text x="0" y="38" fill="#FAF8F4" class="sans" font-size="25" font-weight="900">AUG 2023 — NOW</text>
      <text x="0" y="59" fill="#FF5738" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">CONTINUOUS ENGINEERING RUN</text>
    </g>

    <line x1="373" y1="18" x2="373" y2="70" stroke="#252A36" stroke-width="1" />

    <g transform="translate(560, 0)" text-anchor="middle">
      <text x="0" y="38" fill="#FF4422" class="sans" font-size="25" font-weight="900" letter-spacing="0.5">PERPETUAL</text>
      <text x="0" y="59" fill="#8E95A2" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">PRIVATE CLIENT SPRINT CADENCE</text>
    </g>

    <line x1="747" y1="18" x2="747" y2="70" stroke="#252A36" stroke-width="1" />

    <g transform="translate(934, 0)" text-anchor="middle">
      <text x="0" y="38" fill="#FAF8F4" class="sans" font-size="25" font-weight="900">550+ DAYS</text>
      <text x="0" y="59" fill="#FF5738" class="mono" font-size="10" font-weight="700" letter-spacing="1.2">DISCIPLINE HORIZON // 5,600+ HRS</text>
    </g>
  </g>
</svg>